  <text x="24" y="130" fill="#434d58" font-size="13">Followers</text><text x="192" y="130" fill="#434d58" font-size="13" font-weight="700" text-anchor="end">2</text>
  <text x="224" y="130" fill="#434d58" font-size="13">Years on GitHub</text><text x="392" y="130" fill="#434d58" font-size="13" font-weight="700" text-anchor="end">14</text>
