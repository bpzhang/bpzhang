  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="420" height="155" rx="8" fill="#fffefe" stroke="#e4e2e2"/>
  <text x="24" y="32" fill="#2E9EF7" font-size="16" font-weight="700">GitHub Stats</text>
  <text x="396" y="32" fill="#8b949e" font-size="10" text-anchor="end">includes private originals</text>
  <text x="24" y="62" fill="#434d58" font-size="13">Public Repos</text><text x="192" y="62" fill="#434d58" font-size="13" font-weight="700" text-anchor="end">58</text>
  <text x="224" y="62" fill="#434d58" font-size="13">Private Originals</text><text x="392" y="62" fill="#434d58" font-size="13" font-weight="700" text-anchor="end">46</text>
  <text x="24" y="96" fill="#434d58" font-size="13">Original Repos</text><text x="192" y="96" fill="#434d58" font-size="13" font-weight="700" text-anchor="end">55</text>
